name: 功能建议
description: 提出新功能或改进
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看 [ai/INVARIANTS.md](https://github.com/edwinhuish/waachat/blob/main/ai/INVARIANTS.md)
        与 [docs/roadmap.md](https://github.com/edwinhuish/waachat/blob/main/docs/roadmap.md)。
        有四条硬约束是不可协商的，围绕它们的建议不会被接受。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的真实问题
      description: 描述场景与痛处，而不是直接给出实现方案
      placeholder: |
        我经常需要从群里翻半年前发的合同附件，现在的做法是……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案，以及为什么不用它们
    validations:
      required: false

  - type: checkboxes
    id: invariants
    attributes:
      label: 与硬约束的关系
      description: 如果这个建议需要放宽其中任何一条，请直接说明，那会改变讨论的性质
      options:
        - label: 这个建议不需要向被承载的页面注入脚本
        - label: 这个建议不需要重实现任何私有传输协议
        - label: 这个建议不需要触碰密钥或加密
        - label: 这个建议不需要新增原生依赖或系统级权限（若需要，请在下方说明）
