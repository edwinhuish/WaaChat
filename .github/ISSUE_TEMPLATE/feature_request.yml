name: 功能建议
description: 提出新功能或改进
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看 [ai/INVARIANTS.md](https://github.com/edwinhuish/waachat/blob/main/ai/INVARIANTS.md)
        与 [docs/roadmap.md](https://github.com/edwinhuish/waachat/blob/main/docs/roadmap.md)。
        仍生效的硬约束是 **INV-3（不经手密钥与加密）** 与 **INV-4（不使用服务方的视觉标识资产）**，
        围绕它们的建议不会被接受（原 INV-1 / INV-2 已由 ADR-0043 撤销）。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的真实问题
      description: 描述场景与痛处，而不是直接给出实现方案
      placeholder: |
        我经常需要从群里翻半年前发的合同附件，现在的做法是……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案，以及为什么不用它们
    validations:
      required: false

  - type: checkboxes
    id: invariants
    attributes:
      label: 与硬约束的关系
      description: 如果这个建议需要放宽其中任何一条，请直接说明，那会改变讨论的性质
      options:
        - label: 这个建议不需要触碰密钥或加密（INV-3）
        - label: 这个建议不需要使用服务方的视觉标识资产（INV-4）
        - label: 这个建议不需要新增原生依赖或系统级权限（若需要，请在下方说明）
